
<!DOCTYPE html>
<html>
<head>
    <title>Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">

        <h2>Marks Calculator</h2>

        <input type="text"  id="name" placeholder="Enter your name"><br><br>
        <input type="number" id="eng" placeholder="Enter your English marks"><br><br>
        <input type="number" id="urdu" placeholder="Enter your Urdu marks"><br><br>
        <input type="number" id="comp" placeholder="Enter your Computer marks"><br><br>
        <input type="number" id="sci" placeholder="Enter your Science marks"><br><br>
        <button onclick="result()">Calculate</button>

    </div>

    <div class="result">
        <h2>Student Result</h2>
        <p id="output"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
